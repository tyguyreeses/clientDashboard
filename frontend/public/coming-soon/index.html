<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F4EE" />
    <title>Hair By Maddie — Coming Soon</title>
    <style>
      :root {
        --mocha: #493a34;
        --rose: #b9827c;
        --pink: #e8c9c3;
        --parchment: #f7f4ee;
        --cinnamon: #a9684f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--mocha);
        background: var(--parchment);
        font-family: Georgia, serif;
        font-size: 16px;
      }

      main {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        padding: 32px 20px 72px;
      }

      main::before {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(var(--pink) 1px, transparent 1px);
        background-size: 24px 24px;
        mask-image: linear-gradient(to bottom, black, transparent 75%);
        opacity: 0.55;
        content: "";
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(1px);
        opacity: 0.52;
      }

      .one {
        top: -180px;
        right: -130px;
        width: 390px;
        height: 390px;
        background: var(--pink);
      }

      .two {
        bottom: -120px;
        left: -80px;
        width: 250px;
        height: 250px;
        background: #ead9c9;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        width: min(760px, 100%);
        padding: clamp(30px, 7vw, 76px) clamp(24px, 5vw, 54px);
        padding-bottom: clamp(22px, 4vw, 42px);
        border: 1px solid rgba(185, 130, 124, 0.35);
        border-radius: 28px;
        background: rgba(255, 253, 249, 0.78);
        box-shadow: 0 24px 70px rgba(73, 58, 52, 0.12);
        text-align: center;
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }

      h1 {
        margin: 12px 0;
        font-size: clamp(32px, 6vw, 54px);
        font-weight: 400;
        line-height: 1.08;
      }

      p {
        width: 100%;
        max-width: 450px;
        margin: 10px 0 0;
        color: var(--rose);
        font-size: 20px;
        line-height: 1.7;
      }

      .inquire {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: min(50%, 360px);
        min-width: min(240px, 100%);
        min-height: 48px;
        margin-top: 0;
        padding: 12px 20px;
        border-radius: 999px;
        color: var(--mocha);
        background: var(--pink);
        font-family: Arial, sans-serif;
        font-weight: 700;
        text-decoration: none;
        transition:
          transform 0.25s,
          background 0.2s,
          color 0.2s;
      }

      .inquire:hover {
        color: var(--parchment);
        background: var(--cinnamon);
        transform: translateY(-2px);
      }

      .divider {
        display: block;
        margin-top: 14px;
        color: var(--cinnamon);
        font-size: 18px;
      }

      .admin-link {
        display: inline-block;
        margin-top: 0;
        color: var(--rose);
        font-size: 16px;
        text-decoration: none;
        transition:
          color 0.2s,
          transform 0.25s;
      }

      .admin-link:hover {
        color: var(--cinnamon);
        transform: translateY(-2px);
      }

      footer {
        position: absolute;
        bottom: 28px;
        color: var(--rose);
        font-size: 16px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="orb one"></div>
      <div class="orb two"></div>
      <section class="card">
        <img src="/logo_banner.PNG" alt="Hair By Maddie · Bridal Hairstylist" />
        <h1>Click below to inquire!</h1>
        <a class="inquire" href="/inquiry">Inquire</a>
        <p>Full portfolio site coming soon!</p>
        <span class="divider" aria-hidden="true">✦</span>
        <a class="admin-link" href="/admin">Sign in as admin</a>
      </section>
      <footer>Bridal hairstyling · New England</footer>
    </main>
  </body>
</html>
