<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F4EE">
  <title>Hair By Maddie — Coming Soon</title>
  <style>
    :root { --mocha:#493A34; --rose:#B9827C; --pink:#E8C9C3; --parchment:#F7F4EE; --cinnamon:#A9684F; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--mocha); background:var(--parchment); font-family:Georgia,serif; }
    main { min-height:100vh; display:grid; place-items:center; position:relative; overflow:hidden; padding:32px 20px 72px; }
    main:before { content:""; position:absolute; inset:0; opacity:.55; background-image:radial-gradient(var(--pink) 1px,transparent 1px); background-size:24px 24px; mask-image:linear-gradient(to bottom,black,transparent 75%); }
    .orb { position:absolute; border-radius:50%; filter:blur(1px); opacity:.52; }
    .one { width:390px; height:390px; background:var(--pink); top:-180px; right:-130px; }
    .two { width:250px; height:250px; background:#ead9c9; bottom:-120px; left:-80px; }
    .card { width:min(760px,100%); position:relative; padding:clamp(30px,7vw,76px) clamp(24px,5vw,54px); text-align:center; border:1px solid rgba(185,130,124,.35); border-radius:28px; background:rgba(255,253,249,.78); box-shadow:0 24px 70px rgba(73,58,52,.12); }
    img { display:block; max-width:100%; height:auto; margin:0 auto 44px; }
    .kicker { color:var(--cinnamon); font:700 12px/1.2 Georgia,serif; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:18px 0 16px; font-size:clamp(32px,6vw,54px); line-height:1.08; font-weight:400; }
    p { max-width:450px; margin:0 auto; color:var(--rose); font-size:17px; line-height:1.7; }
    .divider { display:block; margin-top:30px; color:var(--cinnamon); font-size:18px; }
    footer { position:absolute; bottom:28px; color:var(--rose); font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  </style>
</head>
<body><main><div class="orb one"></div><div class="orb two"></div><section class="card"><img src="/logo_banner.PNG" alt="Hair By Maddie · Bridal Hairstylist"><h1>We’re getting ready<br>for your big day</h1><p>Our new online home is almost here. In the meantime, we’re busy creating beautiful bridal hair experiences for you.</p><span class="divider">✦</span></section><footer>Bridal hairstyling · New England</footer></main></body>
</html>
