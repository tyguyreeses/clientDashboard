[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "client-dashboard"
version = "0.1.0"
description = "Backend foundation for a bridal hairstylist client and income tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "uvicorn>=0.30,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
