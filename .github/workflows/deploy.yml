name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H '${{ secrets.DEPLOY_HOST }}' >> "$HOME/.ssh/known_hosts"

      - name: Deploy to server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' \
            '/home/dev/deploy.sh'
